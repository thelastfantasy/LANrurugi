# Archive endpoints whose LANrurugi behaviour goes beyond the upstream contract. A sidecar entry
# replaces the upstream operation as a whole, so each one here restates it in full.
"/api/archives/{id}/progress/{page}":
  put:
    operationId: updateArchiveProgress
    summary: Update reading progression
    description: |
      Records the page of this archive the reader is showing, and the current server time as the
      date it was last read. Call it only for a page the user is actually reading, not while
      preloading images.

      Optional `pages`, LANrurugi only: the length of the page list `page` was counted in (the
      reader sends the length of the list it got from `/files`). When an archive's patch later
      becomes unreadable, its pages drop out of the list and every page after them moves up; the
      length tells the server whether a saved page was counted before or after that, so it can be
      moved to the same picture instead of guessing. A client that leaves it out gets the upstream
      behaviour.

      Fails when the server is configured for client-side progress tracking; check `/api/info`
      first.
    tags: [archives]
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: The archive id.
      - name: page
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        description: The page now being read (1-based), at most the archive's page count.
      - name: pages
        in: query
        required: false
        schema: { type: integer, minimum: 1 }
        description: |
          The length of the page list `page` was counted in. Omitting it clears a length saved
          earlier.
    responses:
      "200":
        description: Saved.
        content:
          application/json:
            schema:
              type: object
              properties:
                operation: { type: string, enum: [update_progress] }
                id: { type: string }
                page: { type: integer }
                lastreadtime: { type: integer, description: Unix seconds. }
                success: { type: integer, enum: [1] }
      "400":
        description: Server-side progress tracking is disabled on this instance.
      "401":
        description: Authentication is required for progress (`authprogress`).
      "404":
        description: No archive with this id.

# Batch "which archives carry these source tags?" (`source_lookup.rs`). Additive and deliberately
# outside the legacy-mirroring `/search*` group: no query syntax, no Tankoubon folding, no
# pagination — the question a userscript asks about a whole clipboard list.
"/api/archives/lookup":
  post:
    operationId: lookupSources
    summary: Look up archives by source tag, in bulk
    description: |
      Answers "which archives carry this `source:` tag?" for a whole list at once. The bulk form of
      `GET /api/search?filter=source:<url>`, which costs a full library scan per URL and, being a
      GET, cannot carry a few hundred URLs at all.

      Archive-level by construction: an archive filed into a Tankoubon is still reported, and a
      Tankoubon's own aggregate id is never reported as an archive. Records a reader cannot open yet
      — catalogued but not yet published, or with the file still arriving — are omitted.

      At most 500 sources per request; a larger list is rejected rather than truncated. Reachable
      with a read-only (guest) token despite the POST: nothing is written.
    tags: [archives]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [sources]
            properties:
              sources:
                type: array
                maxItems: 500
                items: { type: string }
                description: |
                  Sources in any spelling a plugin may have stored: `host/path`, a full URL with
                  either scheme, with or without a trailing slash, optionally already prefixed with
                  `source:`. Duplicates are collapsed, and each distinct string is answered once.
    responses:
      "200":
        description: One entry per distinct source, keyed by the string as sent.
        content:
          application/json:
            schema:
              type: object
              required: [operation, success, matches]
              properties:
                operation: { type: string, enum: [lookup_sources] }
                success: { type: integer, enum: [1] }
                matches:
                  type: object
                  description: |
                    Keyed by the exact source string from the request. A source nothing answers is
                    present with an empty `arcids`, never omitted.
                  additionalProperties:
                    type: object
                    required: [arcids, title]
                    properties:
                      arcids:
                        type: array
                        items: { type: string }
                        description: |
                          Every archive carrying this source tag — a list, because a duplicate
                          import can leave the same source on more than one record.
                      title: { type: [string, "null"], description: The first match's own title. }
      "400":
        description: No sources given, or more than 500.
      "401":
        description: Authentication is required.
      "403":
        description: A credential that may not read the library.
