# LANrurugi behind Cloudflare with a separate download host
#
# Replace these three values before use:
#   lib.example.org      the page host — orange-clouded in Cloudflare (proxied)
#   fs.example.org       the download host — grey-clouded (DNS only), A/AAAA records, not a
#                        CNAME to the proxied record
#   127.0.0.1:3000       where LANrurugi listens (container port or published port)
#
# Why two servers: a CDN is not meant to carry bulk non-HTML content, the edge can read the bytes,
# and a response whose first byte waits on a zip being generated can exceed the edge's 100-second
# origin timeout (524). Downloads go to fs.example.org, which never touches Cloudflare.
#
# The application enforces the same boundary from its side: requests whose Host is the configured
# download host only reach /api/dl/ and /api/share/r/ (crates/lanrurugi-api/src/download_host.rs).
# This file is the other half — it must not be tempting to skip, because a hand-written config
# usually gets the CF-Connecting-IP handling and the path allowlist wrong.
#
# Test with: nginx -t -c /etc/nginx/nginx.conf   (this file is a server block set, include it from
# the http { } context, not as a whole nginx.conf)

# ── Server 1: anything that does not match a known name gets no handshake at all ──────────────
# Without this, a request for an unrelated Host that resolves here gets the first server's
# certificate and a confusing 404 (or, worse, the page site's content).
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # No certificate configured on purpose: the handshake is rejected rather than served by an
    # arbitrary vhost.
    ssl_reject_handshake on;

    return 404;
}

# ── Server 2: the page host, reachable only through Cloudflare ────────────────────────────────
# If you cannot keep this allow-list current, do not orange-cloud the page host: the allow-list is
# what stops a direct request from bypassing the CDN's protections.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lib.example.org;

    ssl_certificate     /etc/letsencrypt/live/lib.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lib.example.org/privkey.pem;

    # Cloudflare's edge ranges, https://www.cloudflare.com/ips/ — refresh when they change.
    # (Trimmed to the IPv4 set here; add a `geo $realip_remote_addr $is_cf` block for the IPv6 set
    # if you serve IPv6, or keep the allow list below for both.)
    allow 173.245.48.0/20;
    allow 103.21.244.0/22;
    allow 103.22.200.0/22;
    allow 103.31.4.0/22;
    allow 141.101.64.0/18;
    allow 108.162.192.0/18;
    allow 190.93.240.0/20;
    allow 188.114.96.0/20;
    allow 197.234.240.0/22;
    allow 198.41.128.0/17;
    allow 162.158.0.0/15;
    allow 104.16.0.0/13;
    allow 104.24.0.0/14;
    allow 172.64.0.0/13;
    allow 131.0.72.0/22;
    allow 2400:cb00::/32;
    allow 2606:4700::/32;
    allow 2803:f800::/32;
    allow 2405:b500::/32;
    allow 2405:8100::/32;
    allow 2a06:98c0::/29;
    allow 2c0f:f248::/32;
    deny all;

    # Cloudflare sets this; trust it only because the allow list above already proved the peer is
    # an edge. `real_ip_recursive off` matters: with it on, a client-supplied X-Forwarded-For entry
    # could become the "real" address.
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Overwrite, never append: the client's own X-Forwarded-For must not reach the app, which
        # would let it choose its apparent address for rate limits and share IP rules.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Host $host;

        # The app streams repacks; buffering here would reintroduce the late-first-byte problem.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ── Server 3: the download host, never proxied ────────────────────────────────────────────────
# Grey cloud: requests arrive straight from the client. Only download paths exist here; everything
# else is 404, matching what the application itself does for this Host.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fs.example.org;

    ssl_certificate     /etc/letsencrypt/live/fs.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fs.example.org/privkey.pem;

    # A grey-clouded name cannot use the HTTP-01 challenge (nothing answers port 80 for it) —
    # issue this certificate with DNS-01.

    client_max_body_size 0;

    location /api/dl/ {
        # Strip whatever the client sent: on this host the peer is the client, so CF-Connecting-IP
        # is a forgery by definition. The app refuses to trust it unless the peer is an edge, but
        # removing it here keeps the intent obvious.
        # There is no CDN in front of this one, so the peer is the visitor: forward it as
        # X-Forwarded-For (overwriting, never appending a client-supplied value) or every share
        # request looks like it came from this host and IP allow-lists/rate limits collapse.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";

        # Never buffer a multi-GB response to disk, and do not give up while bytes are flowing.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;

        # A per-client cap keeps one downloader from starving the rest; raise it for power users.
        limit_conn perip 4;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    location /api/share/r/ {
        # Share range endpoints are read cross-origin by the share page on the page host; the app
        # already answers with the CORS headers and exposes x-lrr-*.
        proxy_set_header CF-Connecting-IP "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_http_version 1.1;
        limit_conn perip 4;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;

        # Share responses are per-token; a shared cache would leak one reader's bytes to another.
        add_header Cache-Control "private, no-store" always;
    }

    location / {
        return 404;
    }
}

# ── Plain HTTP: redirect pages, refuse downloads ──────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name lib.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name fs.example.org;
    # Downloads over cleartext would be blocked as mixed content anyway; send them to https rather
    # than silently serving nothing.
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

# ── limit_conn zones (put these in the http { } context, once) ────────────────────────────────
