# Rust build acceleration (constitution Technology Stack Constraints): mold as the linker on
# Linux. `RUSTC_WRAPPER=sccache` (set in .mise.toml) handles compilation-object caching; this
# handles the separate link step, which matters for a workspace with this many member crates.
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))']
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# `libarchive2-sys` 0.2.0 bundles libarchive 3.8.1, whose `archive_string.c` passes `const char **`
# where glibc's `iconv` takes `char **`. GCC 15 — the default on `ubuntu-latest`'s rolling image and
# on current host distros — makes `-Wincompatible-pointer-types` a hard error, so building the
# bundled C library fails before any Rust code compiles (CI run 42490892281). The crate has no newer
# release to pin to, and its CMake flags already include `-w`, which only silences warnings; demote
# just this one diagnostic back to a warning for the C compiler the crate's build script invokes.
[env]
CFLAGS = { value = "-Wno-error=incompatible-pointer-types", force = false }
