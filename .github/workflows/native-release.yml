name: 'Native Release Packages'

# Native packages next to the container images (specs/015-native-platforms): one tarball per
# platform, each smoke-tested on the machine that built it, attached to the tag's GitHub release.
# `workflow_dispatch` builds and uploads the packages as artifacts without publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  BINARIES: -p lanrurugi-server -p lanrurugi-book-worker -p lanrurugi-embed-worker -p lanrurugi-gpu-worker
  # Turns off libarchive features whose system libraries users may not have (see the file).
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/packaging/libarchive-portable.cmake

jobs:
  assets:
    name: frontend, docs, plugins
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      - name: Generate the API document
        run: cargo run -p lanrurugi-api-docgen
      - name: Build frontend, docs and plugin bundle
        run: scripts/build-native-assets.sh native-assets
      - uses: actions/upload-artifact@v4
        with:
          name: native-assets
          path: native-assets
          retention-days: 7

  linux:
    name: linux-${{ matrix.arch }}
    needs: assets
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # .mise.toml sets RUSTC_WRAPPER=sccache and .cargo/config.toml links with mold on Linux, so
      # both must be installed alongside the toolchain.
      - uses: jdx/mise-action@v2
        with:
          install: true
          install_args: rust deno sccache mold
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-linux-${{ matrix.arch }}
      # libarchive2-sys links xml2/acl/crypto by name, so their -dev packages must exist here; the
      # toolchain file keeps libarchive from using xml2/acl, and --as-needed then drops them from
      # the binary. Redis comes from redis.io because 22.04's own package is 6.0.
      - name: Build and smoke-test dependencies
        run: |
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor -o /usr/share/keyrings/redis.gpg
          echo "deb [signed-by=/usr/share/keyrings/redis.gpg] https://packages.redis.io/deb $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config nasm zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev \
            libxml2-dev libacl1-dev libssl-dev \
            redis djvulibre-bin fonts-noto-cjk fonts-noto-color-emoji
      - name: Build release binaries
        run: cargo build --release --locked $BINARIES
      - uses: actions/download-artifact@v4
        with:
          name: native-assets
          path: native-assets
      - name: Package
        run: scripts/package-native.sh "linux-${{ matrix.arch }}" "${GITHUB_REF_NAME#v}" target/release native-assets dist
      - name: Linked libraries
        run: ldd target/release/lanrurugi-server target/release/lanrurugi-book-worker
      - name: Smoke test
        env:
          SMOKE_EXPECT: pdfium onnxruntime djvulibre deno
          SMOKE_LIBRARY: smoke-library
          SMOKE_STRICT: '1'
        run: |
          scripts/smoke-sample-library.sh smoke-library
          scripts/smoke-native.sh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  macos:
    name: macos-arm64
    needs: assets
    runs-on: macos-14
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # libarchive2-sys names libb2/xml2 at link time even when libarchive does not use them; drop
      # every dylib the binary does not actually reference.
      RUSTFLAGS: -C link-arg=-Wl,-dead_strip_dylibs
    steps:
      - uses: actions/checkout@v4
      # sccache because .mise.toml sets RUSTC_WRAPPER=sccache (mold is Linux-only).
      - uses: jdx/mise-action@v2
        with:
          install: true
          install_args: rust deno sccache
          cache: true
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: native-macos-arm64
      - name: Build and smoke-test dependencies
        run: brew install cmake pkg-config nasm xz lz4 zstd libb2 redis djvulibre
      - name: Build release binaries
        run: cargo build --release --locked $BINARIES
      - uses: actions/download-artifact@v4
        with:
          name: native-assets
          path: native-assets
      - name: Package
        run: scripts/package-native.sh macos-arm64 "${GITHUB_REF_NAME#v}" target/release native-assets dist
      - name: Linked libraries
        run: otool -L target/release/lanrurugi-server target/release/lanrurugi-book-worker
      - name: Smoke test
        env:
          SMOKE_EXPECT: pdfium onnxruntime djvulibre deno
          SMOKE_LIBRARY: smoke-library
          SMOKE_STRICT: '1'
        run: |
          scripts/smoke-sample-library.sh smoke-library
          scripts/smoke-native.sh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: package-macos-arm64
          path: dist/*.tar.gz

  freebsd:
    name: freebsd-x86_64
    needs: assets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-assets
          path: native-assets
      # PDFium and ONNX Runtime come from FreeBSD packages here, not from the tarball; the smoke
      # test still expects them, installed the way the guide says.
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.3'
          usesh: true
          envs: 'BINARIES GITHUB_REF_NAME CMAKE_TOOLCHAIN_FILE'
          prepare: |
            pkg install -y curl git bash cmake pkgconf nasm lz4 zstd \
              redis deno djvulibre pdfium onnxruntime \
              noto-serif-sc noto-sans-sc
          run: |
            curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal \
              --default-toolchain "$(sed -n 's/^rust = { version = "\([^"]*\)".*/\1/p' .mise.toml)"
            . "$HOME/.cargo/env"
            cargo build --release --locked $BINARIES
            ldd target/release/lanrurugi-server
            scripts/package-native.sh freebsd-x86_64 "${GITHUB_REF_NAME#v}" target/release native-assets dist
            scripts/smoke-sample-library.sh smoke-library
            SMOKE_EXPECT="pdfium onnxruntime djvulibre deno" SMOKE_LIBRARY=smoke-library SMOKE_STRICT=1 \
              scripts/smoke-native.sh dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: package-freebsd-x86_64
          path: dist/*.tar.gz

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, freebsd]
    runs-on: ubuntu-24.04
    steps:
      # The release body *is* the changelog: the app's own upgrade overlay renders it
      # (`GET /api/version?since=`), so it is generated here from the commits this tag contains.
      # `fetch-depth: 0` is what the range arithmetic needs — the previous tag and the full log
      # between it and this one are not in a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate bilingual release notes
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        # The release must still publish when translation fails (no key, GitHub/DeepSeek outage):
        # the script degrades to Chinese-only on its own, this guards only a crash.
        run: |
          python3 scripts/release-changelog.py --output release-notes.md \
            || printf '# %s\n' "${GITHUB_REF_NAME}" > release-notes.md
          head -20 release-notes.md
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
