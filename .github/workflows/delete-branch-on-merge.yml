name: Delete branch on merge to dev

on:
  pull_request:
    types: [closed]

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete head branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through an environment variable, never interpolated into the script below. A branch name
          # is attacker-controlled on a fork PR, and git's own ref rules do not forbid `"` or `;` —
          # so `${{ ... }}` inside the quoted command would be a real shell-injection path into a job
          # holding `contents: write` and GH_TOKEN. As a variable it is data. (Found by actionlint.)
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # A merge can be the thing that deletes the branch (`gh pr merge --delete-branch`, or the
          # repo's auto-delete setting), in which case this workflow races it and the ref is already
          # gone — a 422 here reddened a whole run for nothing. Probe first, so "already deleted" is
          # a notice rather than a failure.
          if gh api "repos/${{ github.repository }}/git/refs/heads/$HEAD_REF" >/dev/null 2>&1; then
            gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$HEAD_REF"
          else
            echo "::notice::$HEAD_REF is already gone — nothing to delete."
          fi
