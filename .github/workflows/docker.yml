name: 'Push Docker Images'

# Zipline-style continuous image publishing. Besides producing runnable images, the final
# `amend-builds` job is what the new `/api/version` endpoint watches for: when it completes
# successfully for a commit, that commit's multi-arch image is pullable and users running an
# upstream/trunk build can be told an update is actually available (not merely that a newer commit
# exists on GitHub).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        arch: [amd64, arm64]
    name: push
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            LANRURUGI_GIT_SHA=${{ steps.sha.outputs.short_sha }}
          tags: |
            ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-${{ matrix.arch }}
            ghcr.io/thelastfantasy/lanrurugi:main-${{ matrix.arch }}

  amend-builds:
    runs-on: ubuntu-24.04
    needs: push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull images
        run: |
          docker pull --platform=linux/amd64 ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-amd64
          docker pull --platform=linux/arm64 ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-arm64

      - name: create manifests
        run: |
          docker manifest create ghcr.io/thelastfantasy/lanrurugi:main \
            --amend ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-amd64 \
            --amend ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-arm64
          docker manifest create ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }} \
            --amend ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-amd64 \
            --amend ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}-arm64

      - name: push manifests
        run: |
          docker manifest push ghcr.io/thelastfantasy/lanrurugi:main
          docker manifest push ghcr.io/thelastfantasy/lanrurugi:main-${{ steps.sha.outputs.short_sha }}
