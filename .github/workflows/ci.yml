name: CI

on:
  push:
    # `dev` is the repository's default branch, so a merge into it has to run CI too — without it
    # the default branch was the one place nothing was ever checked (only PRs and `main` were).
    branches: [main, dev]
  pull_request:

env:
  RUSTC_WRAPPER: sccache

# Least privilege, stated explicitly: without a `permissions` block the job token inherits the
# repository default, which is read-write on contents for older repos (CodeQL's
# `actions/missing-workflow-permissions` flags exactly that). Nothing here writes through
# GITHUB_TOKEN — the docs job publishes with a Cloudflare API token from secrets, and uploading or
# downloading an artifact needs no write scope.
permissions:
  contents: read

# A fix-up push to the same PR cancels its previous run instead of leaving it to finish; pushes to
# `main`/`dev` are never cancelled (they are the record for that commit).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust (check, fmt, clippy, test)
    runs-on: ubuntu-latest
    env:
      LANRURUGI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      # `ubuntu-latest` ships ~14 GB of toolchains this job never touches (Android SDK, .NET, GHC,
      # the CodeQL bundle). `cargo test` links a dozen example binaries on top of a restored
      # target/ cache and started overrunning the remaining space — `mold: failed to write to an
      # output file. Disk full?` followed by `No space left on device` during linking (first seen
      # 2026-11-03, on three unrelated dependency PRs at once). Reclaim it before anything builds.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # Caches ~/.cargo and target/ across runs (constitution Technology Stack Constraints:
      # "Rust build acceleration").
      #
      # `cache-directories` additionally persists sccache's own object cache
      # (~/.cache/sccache). Without this, sccache had a 0.00% hit rate on Rust objects on every
      # observed run (confirmed via `sccache --show-stats` on runs 29195223998/29195590947/
      # 29671404959) — each run got a brand-new runner VM with an empty sccache dir, so
      # RUSTC_WRAPPER=sccache was pure overhead (a wrapper process per rustc invocation) with zero
      # payoff. rust-cache's default directory set doesn't include it since sccache isn't
      # rust-cache's concern.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-directories: /home/runner/.cache/sccache

      - name: Zero sccache stats (isolate this run's hit rate from cache-restore noise)
        run: sccache --zero-stats

      # Same set `Dockerfile.build`'s dev image installs (see that file's own comment) —
      # `libarchive2-sys` bundles and statically links libarchive's C source, which itself links
      # against these at build time. `ubuntu-latest` doesn't ship them, so linking failed with
      # "mold: fatal: library not found: bz2" (first library alphabetically probed; the others
      # would have failed the same way one at a time without this).
      #
      # `perl`/`cpanminus` here too: `lanrurugi-plugin-converter`'s own `cargo test` now shells out
      # to a real `perl` + PPI invocation (`ppi.rs`'s own doc comment — genuinely parsing legacy
      # Perl plugin source needs a real Perl parser, not a hand-rolled one), confirmed via a real
      # CI failure (run 31936693031) where both of its "converts cleanly, zero boilerplate" tests
      # failed with "Can't locate PPI.pm in @INC" — `ubuntu-latest` ships a bare `perl` with no CPAN
      # modules preinstalled. The host binary itself (`lanrurugi-server`) never needs Perl; this is
      # purely a `cargo test`-time dependency of the offline conversion tool, same as
      # `Dockerfile.build`'s own `perl cpanminus` + `cpanm PPI JSON::PP` steps.
      - name: Install libarchive build dependencies + redis-server + perl/PPI
        run: |
          scripts/ci-apt-update.sh
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev \
            nasm libopenjp2-7-dev \
            redis-server perl cpanminus \
            djvulibre-bin fonts-noto-cjk fonts-noto-color-emoji
          sudo cpanm --notest PPI JSON::PP

      # The e-book worker's end-to-end tests load PDFium (pinned in scripts/fetch-pdfium.sh) and run
      # DjVuLibre's tools; the text typesetter needs CJK fonts. Without these the tests skip.
      # GitHub's release CDN answered 504 on every retry of two consecutive runs (2026-11-09), so
      # the download is cached: the key changes only when the pin changes.
      - name: Cache PDFium
        uses: actions/cache@v6
        with:
          path: .pdfium/linux-x64
          key: pdfium-${{ runner.os }}-7543

      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh amd64 .pdfium/linux-x64

      # A `services.redis` Docker container can't be started with a custom `--databases` count
      # (the `services:` schema only allows docker-run flags via `options`, not overriding the
      # image's own command — and Redis's `databases` setting is immutable at runtime, confirmed
      # via `CONFIG SET databases N` returning "can't set immutable config"). The workspace's own
      # test suites collectively claim logical DB indices up to 23 across several crates
      # (`lanrurugi-scanner::pipeline`'s own comment documents its disjoint-offset convention with
      # `full_scan.rs`) — `redis-server`'s own default of 16 databases (0-15) isn't enough. Same
      # real-binary approach the `e2e` job already uses (see its own comment: a service container
      # can't be given the extra flags a real binary can).
      #
      # `apt-get install redis-server`'s own postinst script starts a systemd-managed instance
      # immediately, bound to :6379 with the package's default 16-database config — confirmed via
      # a real failed run (29731953500) where `redis-cli ping` came back instantly (too fast to be
      # our own `--daemonize yes` instance actually starting) and `cargo test` still hit the exact
      # same "DB index is out of range" error. Must stop that one first, or our own invocation
      # below either fails to bind :6379 or simply loses the race to which process gets it.
      - name: Start redis-server with extra logical databases
        run: |
          sudo systemctl stop redis-server || true
          redis-server --daemonize yes --databases 64 --save "" --appendonly no
          for _ in $(seq 1 10); do
            redis-cli ping && break
            sleep 1
          done

      # No separate `cargo check` step: `cargo clippy` below compiles the same graph and fails on
      # the same errors while also applying the lint gate, so a check-then-clippy pair paid for the
      # same compilation twice.

      # License gate (issue #108). The Chinese/Japanese text-normalization ecosystem contains
      # crates that would be legally incompatible with this MIT/Apache-2.0 project — `zhconv`
      # (GPL-2.0-or-later) and `jp_utils` (AGPL-3.0) were both concrete near-misses during the
      # search-equivalence evaluation. `deny.toml` allowlists permissive licenses only, so any
      # GPL/LGPL/AGPL dependency fails this step. `--all-features` (cargo-deny-action's default
      # `arguments`) is intentional: the optional OCR/inpaint/ONNX crates are checked too.
      # Only on `main`: the lockfile a release ships is the one that matters, and this action
      # spends minutes in its own container on every PR otherwise.
      - name: cargo deny (licenses)
        if: github.ref == 'refs/heads/main'
        uses: EmbarkStudios/cargo-deny-action@v2
        # The job-level `RUSTC_WRAPPER=sccache` must not leak into this action's own Alpine
        # container (which has no sccache): `cargo metadata` would then fail with
        # "could not execute process `sccache ... rustc -vV`". An empty value makes cargo treat
        # the wrapper as unset. Confirmed against the first real run of this step (run 36417649477:
        # it failed on exactly that sccache error before this override was added).
        env:
          RUSTC_WRAPPER: ""
        with:
          command: check
          command-arguments: licenses
          arguments: "--all-features"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: plugin tests (deno)
        run: mise run test-plugins

      # Cheap, no build: catches the beta.1/beta.2 class of mistake at PR time — the release
      # Dockerfile built and copied fewer binaries than Dockerfile.dev, so every shipped image was
      # missing the embed and GPU workers. See the script's own header.
      - name: release image binary parity
        run: scripts/check-image-binaries.sh

      # 022: vendor/iroh-relay and vendor/netwatch are generated (crates.io release + vendor/patches/);
      # a hand edit there would be lost on the next upgrade, so it fails here instead.
      - name: vendored forks match their patches
        run: scripts/vendor-forks.sh --check

      # 023: the sharing engine talks to the application only through `ShareHost`. Comment lines
      # may name what is kept out; code and manifest may not.
      - name: sharing engine boundary
        run: |
          if grep -rnE '^\s*[^/[:space:]].*\b(AppState|lanrurugi_api|axum)\b' crates/lanrurugi-share/src \
             || grep -nE '^(lanrurugi-api|axum)\b' crates/lanrurugi-share/Cargo.toml; then
            echo "lanrurugi-share must not depend on lanrurugi-api, axum or AppState" >&2
            exit 1
          fi

      # PRs and `dev` merges: a compile-only check (`--all-targets` still covers every test and
      # bench target). `main`: the full lint gate, since that is the only place a lint can still
      # stop a release. The pre-commit hook runs clippy locally, so a warning usually never gets
      # this far. `--locked` as in `release.yml`: two lockfile PRs merged one after the other can
      # leave a `Cargo.lock` cargo would silently rewrite, and the release build refuses it.
      - name: cargo check
        if: github.ref != 'refs/heads/main'
        run: cargo check --locked --workspace --all-targets

      - name: cargo clippy
        if: github.ref == 'refs/heads/main'
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      # Three tiers, because the expensive part of this job is *linking* test binaries, not running
      # them (620 s on a warm cache: 175 s executing, the rest linking 80+ integration binaries):
      #
      #   pull_request     nothing executes; `cargo check --all-targets` already compiles every test
      #                    target, so a test that no longer builds still fails here
      #   push to `dev`    the unit subset (`--lib --bins`, ~2-3 min) — a merge into the default
      #                    branch means the code is final, so it gets one real execution pass
      #   push to `main`   the full suite, including the integration binaries, right before release
      #
      # `--no-fail-fast` is not optional: without it `cargo test --workspace` aborts on the first
      # failing binary, silently skipping every crate still queued behind it (confirmed live
      # 2026-08-28: a `lanrurugi-server` failure cut a run off before `lanrurugi-storage`'s own
      # tests ever ran). `mise run test` carries the same flag for the same reason.
      # #284: frontend API types generated from the Rust structs (ts-rs). Regenerated on every run,
      # PRs included, and a difference means a Rust change was not carried over to the frontend.
      - name: generated frontend API types are in sync
        run: |
          cargo test -p lanrurugi-storage --lib export_bindings
          git diff --exit-code -- apps/frontend/src/api/generated

      - name: cargo test (unit subset)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: cargo test --workspace --no-fail-fast --lib --bins

      - name: cargo test (full suite)
        if: github.ref == 'refs/heads/main'
        run: cargo test --workspace --no-fail-fast

      - name: sccache stats
        if: always()
        run: scripts/sccache-summary.sh

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # Every pnpm invocation below runs from the repo root with `--filter`, never with cwd inside
      # apps/frontend (`working-directory:` on a step, or `defaults.run.working-directory`) —
      # pnpm-lock.yaml and pnpm-workspace.yaml both live at the repo root, and pnpm 11.10's
      # workspace detection is unreliable when invoked from a workspace subdirectory (confirmed
      # via `act` + manual repro: `pnpm root -w` run from apps/frontend resolves back to
      # apps/frontend/node_modules instead of the real root). Concretely this broke two things
      # when cwd was apps/frontend: `--frozen-lockfile` compared package.json against a lockfile
      # it treated as non-workspace-shaped, falsely reporting every real dependency as "newly
      # added" (e.g. zod); and plain `pnpm run <script>` re-triggers pnpm's own deps-status-check
      # (implicit install) which then couldn't see the root pnpm-workspace.yaml's `allowBuilds`
      # entries either, failing on `sharp`'s ignored build script even though it's allow-listed.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm --filter lanrurugi-frontend run lint

      # Parse-only check; covers tests/, which `tsc -b` never compiles (issue #112).
      - name: syntax check
        run: pnpm --filter lanrurugi-frontend exec node scripts/check-syntax.mjs src tests

      # Type-check on every push (seconds); the production bundle and the unit tests only on a
      # `main` push, next to the Rust suite — see the `cargo test` step's own comment for why the
      # long half of CI is parked at the release merge.
      - name: tsc type-check
        run: pnpm --filter lanrurugi-frontend exec tsc -b --force

      - name: build (vite bundle)
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter lanrurugi-frontend run build

      - name: vitest (unit)
        if: github.ref == 'refs/heads/main'
        run: pnpm --filter lanrurugi-frontend run test:unit

  # #286: every main page opened with the seed data (`tests/seed/seed.mjs`) loaded. Only the
  # `@smoke` specs, Chromium only, one worker: the full Playwright suite (4 workers, two browsers)
  # was dropped from CI after GitHub runners OOM-killed it (f40856e).
  e2e-smoke:
    name: Frontend smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          save-if: false

      - name: Install libarchive build dependencies + redis-server
        run: |
          scripts/ci-apt-update.sh
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev \
            nasm libopenjp2-7-dev redis-server
          sudo systemctl stop redis-server || true

      - name: Build backend (debug)
        run: cargo build -p lanrurugi-server

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm --filter lanrurugi-frontend exec playwright install --with-deps chromium

      - name: Build frontend
        run: pnpm --filter lanrurugi-frontend run build

      - name: playwright smoke
        run: pnpm --filter lanrurugi-frontend exec playwright test --project=chromium --grep @smoke --workers=1

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-report
          path: apps/frontend/playwright-report/
          retention-days: 7

  # 011-api-docs-site. Split into generate and build on purpose rather than run as one job:
  # `docs-generate` is the enforceable gate — a cheap Rust-only run whose failure means the
  # generated API reference and the server's own route table disagree — while `docs-build` owns the
  # Node/Astro toolchain and publishing. Keeping them apart means a red run immediately names which
  # half broke, and the gate can be a required check without pulling a JS toolchain into it.
  docs-generate:
    name: Docs (generate + gate)
    runs-on: ubuntu-latest
    steps:
      # Full history: `docs-sdk` builds every earlier SDK version from the release tags.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # The generator links nothing from the product, so this job never compiles Redis, the OCR
      # stack, or any model asset — which is the whole reason the gate is affordable as its own job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      # `--check` writes nothing and runs every gate: a route the scanner cannot resolve, a mount
      # point the mount table does not know, or a sidecar fragment describing an endpoint that does
      # not exist all fail here, naming the offending file and line.
      # `cargo run` directly, never `mise run docs-api`: that task routes through
      # `scripts/cargo-container-run.sh`, which runs a `lanrurugi-dev` image only `mise run
      # dev-rebuild` builds on a contributor's machine. CI has no such image, so the task could never
      # have run here. The `rust` job below sets the same convention. The generator's defaults
      # (`--policy`, `--access-notes`, `--output`) come from its own CLI, so nothing is lost.
      - name: Gate — the reference must match the route table
        run: cargo run -p lanrurugi-api-docgen -- --check

      # A second, writing invocation for the artefact the site build consumes. The gates are not
      # conditional on `--check` (they run either way), so this cannot publish something the gate
      # rejected — the two invocations differ only in whether the JSON is written.
      - name: Generate the API document
        run: cargo run -p lanrurugi-api-docgen

      # The per-group page generator owns two gates the Rust generator cannot see — a group with no
      # entry in `docs/api/tag-names.json`, and two operations in one group sharing a title. They
      # only ran inside the site build, and `docs-build` skips everything outside `main`, so a new
      # route module could reach `dev` and break nothing until the Docker image built the docs.
      # Plain Node with no install needed: it reads the document generated above.
      - name: Docs — API group pages (known tag names, unique operation titles)
        run: node apps/docs-site/scripts/generate-api-pages.mjs

      - name: Generate the plugin SDK reference
        run: mise run docs-sdk

      # The Pages Function that serves archived docs versions from R2 (#305): its zip reader and
      # page rewriting, against a real archive. Plain Node, no dependencies to install.
      - name: Docs — archived-version Function tests
        run: node --test "apps/docs-site/tests/*.test.mjs"

      # Uploaded so the publishing jobs consume exactly the bytes this job validated, generated from
      # the same revision, rather than regenerating them under a different toolchain. Both paths are
      # consumed as-is: `docs-build` deliberately does not re-run `docs-sdk`.
      - uses: actions/upload-artifact@v7
        with:
          name: docs-generated
          if-no-files-found: error
          path: |
            apps/docs-site/public/openapi.json
            apps/docs-site/dist-sdk/

  docs-build:
    name: Docs (build + publish all three)
    runs-on: ubuntu-latest
    # `always()` with an explicit result check, rather than a bare `needs:` list: adding
    # `rust`/`frontend` as dependencies would otherwise *skip this job entirely* whenever either is
    # red, hiding a docs problem behind an unrelated Rust failure. Building still happens either way;
    # the publish steps below additionally require those two to have passed, so nothing ships from a
    # commit whose tests failed.
    needs: [docs-generate, rust, frontend]
    # Publishing only ever happened on `main`; building the three sites on every PR was minutes of
    # Astro/SDK/Swagger work for output nobody read. The `docs-generate` gate (required on `dev`
    # too) still catches a route table the reference no longer matches.
    if: always() && github.ref == 'refs/heads/main' && needs.docs-generate.result == 'success'
    # Job-level so the `if:` on the deploy step below can see it: a step's own `env` is not
    # available to that step's `if` condition, but the job-level `env` context is.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # Full history: the version selector's options come from `git tag`, and a shallow clone would
      # offer exactly one version — the one being built.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true

      # `path: apps/docs-site`, not `.` and not `apps/docs-site/public`. With multiple paths in the
      # upload, the artifact's root is their *least common ancestor* — here `apps/docs-site/` — so its
      # entries are `public/openapi.json` and `dist-sdk/…`. Extracting into `apps/docs-site/` puts both
      # back exactly where the build looks for them.
      - uses: actions/download-artifact@v8
        with:
          name: docs-generated
          path: apps/docs-site

      # Same rule the frontend job documents at length: every pnpm invocation runs from the repo
      # root with `--filter`, never with cwd inside a workspace package.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The deliverables are built and published independently, each to its own Cloudflare
      # Pages project. They are separate because they answer separate questions for separate
      # audiences: the guides and per-group prose reference; a Swagger UI over the same document,
      # which can show schemas and send requests where a prose reference cannot; and the plugin SDK's
      # `deno doc` tree. Bundling them would put a Swagger bundle in front of someone reading the
      # install guide.
      #
      # `DOCS_SITE_URL` is what puts canonical URLs and `sitemap-index.xml` in the docs build; without
      # it Astro skips the sitemap and only logs a warning (the build still succeeds, which is why
      # this is easy to miss); `site` is also what turns on llms.txt. `DOCS_SDK_URL` and
      # `DOCS_SWAGGER_URL` point the SDK entry and the llms.txt links at those two projects.
      # The defaults are the lrrg.dev subdomains bound to each Pages project; repository variables
      # override them.
      # Docs are versioned by path: everything this repository's release pipeline has ever published
      # stays available under `/v<version>/`, and the build of the current tree joins it. The base is
      # the version's own path so the tree's internal links are absolute and survive being served
      # from anywhere.
      - name: Resolve docs version
        id: docs-version
        run: |
          echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      # The latest version is built for the site root (#305): its URLs never change between releases,
      # so links to it keep working and nothing has to redirect. Older versions stay under
      # `/v<version>/` (static, or from R2 below), and `/v<this version>/…` 301s to the root.
      - name: Build — docs site (this version, at the root)
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://docs.lrrg.dev' }}
          DOCS_SDK_URL: ${{ vars.DOCS_SDK_URL || 'https://sdk.lrrg.dev/' }}
          DOCS_SWAGGER_URL: ${{ vars.DOCS_SWAGGER_URL || 'https://api.lrrg.dev/' }}
          DOCS_VERSION: ${{ steps.docs-version.outputs.version }}
          DOCS_BASE: /
        run: mise run docs-build

      # Older versions come from their releases, not from rebuilding old tags here: a 1.0.0 docs
      # build would need 1.0.0's lockfile and toolchain, which is exactly the thing that rots.
      - name: Download released version zips
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          current="v${{ steps.docs-version.outputs.version }}"
          mkdir -p /tmp/released-docs
          for tag in $(gh release list --limit 1000 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$current" ] && continue
            gh release download "$tag" --pattern 'docs-*.zip' --dir /tmp/released-docs --clobber || true
          done

      # Older versions beyond the few kept static are read from their release zip in R2 by the Pages
      # Function (`apps/docs-site/functions/`). The bucket is created on first use; when R2 cannot be
      # reached (not enabled on the account, or no token) every version simply stays static.
      - name: Ensure the R2 bucket for archived versions
        id: r2
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          bucket=lanrurugi-docs-versions
          status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$bucket")
          if [ "$status" = 404 ]; then
            echo "creating R2 bucket $bucket"
            status=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' -d "{\"name\":\"$bucket\"}")
          fi
          if [ "$status" = 200 ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::R2 is not available (HTTP $status); every docs version stays static"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Place older versions (static or R2)
        env:
          R2_AVAILABLE: ${{ steps.r2.outputs.available || 'false' }}
        run: |
          set -euo pipefail
          current="${{ steps.docs-version.outputs.version }}"
          shopt -s nullglob
          declare -A zips
          for zip in /tmp/released-docs/docs-*.zip; do
            name=$(basename "$zip" .zip); name=${name#docs-}; name=${name#v}
            zips[$name]=$zip
          done
          plan=$(node apps/docs-site/scripts/plan-versions.mjs --current "$current" --r2 "$R2_AVAILABLE" "${!zips[@]}")
          echo "$plan"
          static=$(sed -n 's/^static=//p' <<<"$plan")
          archived=$(sed -n 's/^archived=//p' <<<"$plan")
          for version in ${static//,/ }; do
            mkdir -p "apps/docs-site/dist/v$version"
            unzip -q -o "${zips[$version]}" -d "apps/docs-site/dist/v$version"
          done
          # Archived zips go to R2 only once: a released version's docs never change.
          if [ -n "$archived" ]; then
            objects=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets/lanrurugi-docs-versions/objects?per_page=1000" \
              | jq -r '.result[]?.key' || true)
            for version in ${archived//,/ }; do
              grep -qxF "$version.zip" <<<"$objects" && continue
              echo "uploading $version.zip to R2"
              pnpm exec wrangler r2 object put "lanrurugi-docs-versions/$version.zip" \
                --file "${zips[$version]}" --content-type application/zip --remote
            done
          fi
          echo "ARCHIVED_VERSIONS=$archived" >> "$GITHUB_ENV"

      - name: Assemble the version manifest, redirects and routes
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://docs.lrrg.dev' }}
        run: |
          node apps/docs-site/scripts/assemble-versions.mjs \
            --current "${{ steps.docs-version.outputs.version }}" --archived "$ARCHIVED_VERSIONS"
          if [ -n "$ARCHIVED_VERSIONS" ]; then
            printf '\n[[r2_buckets]]\nbinding = "DOCS_VERSIONS"\nbucket_name = "lanrurugi-docs-versions"\n' \
              >> apps/docs-site/wrangler.toml
          fi

      - name: Build — Swagger UI
        run: mise run docs-swagger

      # Publishing is skipped, never failed, when the deployment credentials are absent — a fork, a
      # pull request, or anyone else's clone must still get a green pipeline from the build alone.
      # Cloudflare Pages receives prebuilt directories: it is not asked to build anything, because it
      # cannot see this job's generated artefacts or this repository's pinned toolchain.
      # `pages deploy` cannot create a missing project non-interactively, so a project added later
      # (such as the homepage) would fail its first deploy. Same Pages-only token.
      - name: Create missing Pages projects
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          for project in lanrurugi-docs lanrurugi-api-swagger lanrurugi-sdk lanrurugi-home; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$project")
            case "$status" in
              200) ;;
              404)
                echo "creating Pages project $project"
                curl -sf -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H 'Content-Type: application/json' \
                  -d "{\"name\":\"$project\",\"production_branch\":\"main\"}" >/dev/null ;;
              *) echo "::error::looking up Pages project $project returned HTTP $status"; exit 1 ;;
            esac
          done

      - name: Publish docs site
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # From the site's own directory, so `wrangler.toml` (the R2 binding) and `functions/` ship
          # with the static files.
          workingDirectory: apps/docs-site
          command: pages deploy dist --project-name=lanrurugi-docs

      - name: Publish Swagger UI
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs-site/dist-swagger --project-name=lanrurugi-api-swagger

      - name: Publish plugin SDK reference
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs-site/dist-sdk --project-name=lanrurugi-sdk

      # The project homepage: plain HTML/CSS/JS pre-rendered per language by a dependency-free
      # Node script (so crawlers get real text and hreflang alternates without running JS).
      - name: Build homepage
        run: node homepage/build.mjs

      - name: Publish homepage
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy homepage/dist --project-name=lanrurugi-home
