name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTC_WRAPPER: sccache

jobs:
  rust:
    name: Rust (check, fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      LANRURUGI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Caches ~/.cargo and target/ across runs (constitution Technology Stack Constraints:
      # "Rust build acceleration"). Complements, not replaces, sccache below. `shared-key`
      # matches the `e2e` job's own so both converge on one cache entry instead of each
      # recompiling the same dependency graph from scratch — this job's `cargo test --workspace`
      # and `e2e`'s `cargo build -p lanrurugi-server` overlap heavily.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      # Same set `Dockerfile.build`'s dev image installs (see that file's own comment) —
      # `libarchive2-sys` bundles and statically links libarchive's C source, which itself links
      # against these at build time. `ubuntu-latest` doesn't ship them, so linking failed with
      # "mold: fatal: library not found: bz2" (first library alphabetically probed; the others
      # would have failed the same way one at a time without this).
      - name: Install libarchive build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev

      - name: cargo check
        run: cargo check --workspace

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: sccache stats
        run: sccache --show-stats

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm run lint

      - name: build (includes tsc type-check)
        run: pnpm run build

      - name: vitest (unit)
        run: pnpm run test:unit

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Shares the `rust` job's own cache (default `add-job-id-key: true` would otherwise give
      # each job an entirely separate cache entry, even though this job's `cargo build -p
      # lanrurugi-server` recompiles most of the same dependency graph the `rust` job's `cargo
      # test --workspace` already built) — a real, avoidable duplicate-compile cost, not
      # inherent to needing two jobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: Install libarchive build dependencies + redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev \
            redis-server

      - name: Build backend (debug)
        run: cargo build -p lanrurugi-server

      - name: pnpm install
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      # Playwright's own browser downloads (~300MB combined for Chromium+Firefox) are the single
      # largest fixed cost in this job and don't change between runs unless the pinned
      # @playwright/test version does — cache them keyed on that version so most runs skip the
      # download entirely. System-level --with-deps packages are cheap apt installs, not worth
      # caching separately.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('apps/frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox
          else
            pnpm exec playwright install --with-deps chromium firefox
          fi

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build

      - name: playwright test
        working-directory: apps/frontend
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
