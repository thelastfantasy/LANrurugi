name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTC_WRAPPER: sccache

jobs:
  rust:
    name: Rust (check, fmt, clippy, test)
    runs-on: ubuntu-latest
    env:
      LANRURUGI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Caches ~/.cargo and target/ across runs (constitution Technology Stack Constraints:
      # "Rust build acceleration").
      #
      # `cache-directories` additionally persists sccache's own object cache
      # (~/.cache/sccache). Without this, sccache had a 0.00% hit rate on Rust objects on every
      # observed run (confirmed via `sccache --show-stats` on runs 29195223998/29195590947/
      # 29671404959) — each run got a brand-new runner VM with an empty sccache dir, so
      # RUSTC_WRAPPER=sccache was pure overhead (a wrapper process per rustc invocation) with zero
      # payoff. rust-cache's default directory set doesn't include it since sccache isn't
      # rust-cache's concern.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-directories: /home/runner/.cache/sccache

      - name: Zero sccache stats (isolate this run's hit rate from cache-restore noise)
        run: sccache --zero-stats

      # Same set `Dockerfile.build`'s dev image installs (see that file's own comment) —
      # `libarchive2-sys` bundles and statically links libarchive's C source, which itself links
      # against these at build time. `ubuntu-latest` doesn't ship them, so linking failed with
      # "mold: fatal: library not found: bz2" (first library alphabetically probed; the others
      # would have failed the same way one at a time without this).
      #
      # `perl`/`cpanminus` here too: `lanrurugi-plugin-converter`'s own `cargo test` now shells out
      # to a real `perl` + PPI invocation (`ppi.rs`'s own doc comment — genuinely parsing legacy
      # Perl plugin source needs a real Perl parser, not a hand-rolled one), confirmed via a real
      # CI failure (run 31936693031) where both of its "converts cleanly, zero boilerplate" tests
      # failed with "Can't locate PPI.pm in @INC" — `ubuntu-latest` ships a bare `perl` with no CPAN
      # modules preinstalled. The host binary itself (`lanrurugi-server`) never needs Perl; this is
      # purely a `cargo test`-time dependency of the offline conversion tool, same as
      # `Dockerfile.build`'s own `perl cpanminus` + `cpanm PPI JSON::PP` steps.
      - name: Install libarchive build dependencies + redis-server + perl/PPI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev \
            nasm libopenjp2-7-dev \
            redis-server perl cpanminus \
            djvulibre-bin fonts-noto-cjk
          sudo cpanm --notest PPI JSON::PP

      # The e-book worker's end-to-end tests load PDFium (pinned in scripts/fetch-pdfium.sh) and run
      # DjVuLibre's tools; the text typesetter needs CJK fonts. Without these the tests skip.
      - name: Fetch PDFium
        run: scripts/fetch-pdfium.sh amd64 .pdfium/linux-x64

      # A `services.redis` Docker container can't be started with a custom `--databases` count
      # (the `services:` schema only allows docker-run flags via `options`, not overriding the
      # image's own command — and Redis's `databases` setting is immutable at runtime, confirmed
      # via `CONFIG SET databases N` returning "can't set immutable config"). The workspace's own
      # test suites collectively claim logical DB indices up to 23 across several crates
      # (`lanrurugi-scanner::pipeline`'s own comment documents its disjoint-offset convention with
      # `full_scan.rs`) — `redis-server`'s own default of 16 databases (0-15) isn't enough. Same
      # real-binary approach the `e2e` job already uses (see its own comment: a service container
      # can't be given the extra flags a real binary can).
      #
      # `apt-get install redis-server`'s own postinst script starts a systemd-managed instance
      # immediately, bound to :6379 with the package's default 16-database config — confirmed via
      # a real failed run (29731953500) where `redis-cli ping` came back instantly (too fast to be
      # our own `--daemonize yes` instance actually starting) and `cargo test` still hit the exact
      # same "DB index is out of range" error. Must stop that one first, or our own invocation
      # below either fails to bind :6379 or simply loses the race to which process gets it.
      - name: Start redis-server with extra logical databases
        run: |
          sudo systemctl stop redis-server || true
          redis-server --daemonize yes --databases 64 --save "" --appendonly no
          for _ in $(seq 1 10); do
            redis-cli ping && break
            sleep 1
          done

      - name: cargo check
        run: cargo check --workspace

      # License gate (issue #108). The Chinese/Japanese text-normalization ecosystem contains
      # crates that would be legally incompatible with this MIT-licensed project — `zhconv`
      # (GPL-2.0-or-later) and `jp_utils` (AGPL-3.0) were both concrete near-misses during the
      # search-equivalence evaluation. `deny.toml` allowlists permissive licenses only, so any
      # GPL/LGPL/AGPL dependency fails this step. `--all-features` (cargo-deny-action's default
      # `arguments`) is intentional: the optional OCR/inpaint/ONNX crates are checked too.
      - name: cargo deny (licenses)
        uses: EmbarkStudios/cargo-deny-action@v2
        # The job-level `RUSTC_WRAPPER=sccache` must not leak into this action's own Alpine
        # container (which has no sccache): `cargo metadata` would then fail with
        # "could not execute process `sccache ... rustc -vV`". An empty value makes cargo treat
        # the wrapper as unset. Confirmed against the first real run of this step (run 36417649477:
        # it failed on exactly that sccache error before this override was added).
        env:
          RUSTC_WRAPPER: ""
        with:
          command: check
          command-arguments: licenses
          arguments: "--all-features"

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # `--no-fail-fast` — without it, `cargo test --workspace` aborts the moment any single
        # test binary reports a failure, silently skipping every crate still queued behind it
        # (workspace members run in dependency order, not all at once). Confirmed live, 2026-08-28:
        # a `lanrurugi-server` test failure cut a CI run off before `lanrurugi-storage`'s own tests
        # ever ran at all, hiding whatever those results would have been. `mise run test`
        # (`.mise.toml`'s own `[tasks.test]`) already carries this flag for the exact same reason
        # documented there — this step had drifted out of sync with it.
        run: cargo test --workspace --no-fail-fast

      - name: sccache stats
        if: always()
        run: scripts/sccache-summary.sh

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Every pnpm invocation below runs from the repo root with `--filter`, never with cwd inside
      # apps/frontend (`working-directory:` on a step, or `defaults.run.working-directory`) —
      # pnpm-lock.yaml and pnpm-workspace.yaml both live at the repo root, and pnpm 11.10's
      # workspace detection is unreliable when invoked from a workspace subdirectory (confirmed
      # via `act` + manual repro: `pnpm root -w` run from apps/frontend resolves back to
      # apps/frontend/node_modules instead of the real root). Concretely this broke two things
      # when cwd was apps/frontend: `--frozen-lockfile` compared package.json against a lockfile
      # it treated as non-workspace-shaped, falsely reporting every real dependency as "newly
      # added" (e.g. zod); and plain `pnpm run <script>` re-triggers pnpm's own deps-status-check
      # (implicit install) which then couldn't see the root pnpm-workspace.yaml's `allowBuilds`
      # entries either, failing on `sharp`'s ignored build script even though it's allow-listed.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm --filter lanrurugi-frontend run lint

      - name: build (includes tsc type-check)
        run: pnpm --filter lanrurugi-frontend run build

      - name: vitest (unit)
        run: pnpm --filter lanrurugi-frontend run test:unit

  # 011-api-docs-site. Split into generate and build on purpose rather than run as one job:
  # `docs-generate` is the enforceable gate — a cheap Rust-only run whose failure means the
  # generated API reference and the server's own route table disagree — while `docs-build` owns the
  # Node/Astro toolchain and publishing. Keeping them apart means a red run immediately names which
  # half broke, and the gate can be a required check without pulling a JS toolchain into it.
  docs-generate:
    name: Docs (generate + gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # The generator links nothing from the product, so this job never compiles Redis, the OCR
      # stack, or any model asset — which is the whole reason the gate is affordable as its own job.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs

      # `--check` writes nothing and runs every gate: a route the scanner cannot resolve, a mount
      # point the mount table does not know, or a sidecar fragment describing an endpoint that does
      # not exist all fail here, naming the offending file and line.
      # `cargo run` directly, never `mise run docs-api`: that task routes through
      # `scripts/cargo-container-run.sh`, which runs a `lanrurugi-dev` image only `mise run
      # dev-rebuild` builds on a contributor's machine. CI has no such image, so the task could never
      # have run here. The `rust` job below sets the same convention. The generator's defaults
      # (`--policy`, `--access-notes`, `--output`) come from its own CLI, so nothing is lost.
      - name: Gate — the reference must match the route table
        run: cargo run -p lanrurugi-api-docgen -- --check

      # A second, writing invocation for the artefact the site build consumes. The gates are not
      # conditional on `--check` (they run either way), so this cannot publish something the gate
      # rejected — the two invocations differ only in whether the JSON is written.
      - name: Generate the API document
        run: cargo run -p lanrurugi-api-docgen

      - name: Generate the plugin SDK reference
        run: mise run docs-sdk

      # Uploaded so the publishing jobs consume exactly the bytes this job validated, generated from
      # the same revision, rather than regenerating them under a different toolchain. Both paths are
      # consumed as-is: `docs-build` deliberately does not re-run `docs-sdk`.
      - uses: actions/upload-artifact@v4
        with:
          name: docs-generated
          if-no-files-found: error
          path: |
            docs/public/openapi.json
            docs/dist-sdk/

  docs-build:
    name: Docs (build + publish all three)
    runs-on: ubuntu-latest
    # `always()` with an explicit result check, rather than a bare `needs:` list: adding
    # `rust`/`frontend` as dependencies would otherwise *skip this job entirely* whenever either is
    # red, hiding a docs problem behind an unrelated Rust failure. Building still happens either way;
    # the publish steps below additionally require those two to have passed, so nothing ships from a
    # commit whose tests failed.
    needs: [docs-generate, rust, frontend]
    if: always() && needs.docs-generate.result == 'success'
    # Job-level so the `if:` on the deploy step below can see it: a step's own `env` is not
    # available to that step's `if` condition, but the job-level `env` context is.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # `path: docs`, not `path: .` and not `path: docs/public`. With multiple paths in the upload,
      # the artifact's root is their *least common ancestor* — here `docs/` — so its entries are
      # `public/openapi.json` and `dist-sdk/…` (confirmed by listing a real run's artifact).
      # Extracting into `docs/` puts both back exactly where the build looks for them; `.` drops them
      # at the repository root, and `docs/public` nests them one level too deep.
      - uses: actions/download-artifact@v4
        with:
          name: docs-generated
          path: docs

      # Same rule the frontend job documents at length: every pnpm invocation runs from the repo
      # root with `--filter`, never with cwd inside a workspace package.
      - name: pnpm install
        run: pnpm install --frozen-lockfile

      # The deliverables are built and published independently, each to its own Cloudflare
      # Pages project. They are separate because they answer separate questions for separate
      # audiences: the guides and per-group prose reference; a Swagger UI over the same document,
      # which can show schemas and send requests where a prose reference cannot; and the plugin SDK's
      # `deno doc` tree. Bundling them would put a Swagger bundle in front of someone reading the
      # install guide.
      #
      # `DOCS_SITE_URL` is what puts canonical URLs and `sitemap-index.xml` in the docs build; without
      # it Astro skips the sitemap and only logs a warning (the build still succeeds, which is why
      # this is easy to miss); `site` is also what turns on llms.txt. `DOCS_SDK_URL` and
      # `DOCS_SWAGGER_URL` point the SDK entry and the llms.txt links at those two projects.
      # The defaults are the lrrg.dev subdomains bound to each Pages project; repository variables
      # override them.
      - name: Build — docs site
        env:
          DOCS_SITE_URL: ${{ vars.DOCS_SITE_URL || 'https://docs.lrrg.dev' }}
          DOCS_SDK_URL: ${{ vars.DOCS_SDK_URL || 'https://sdk.lrrg.dev/' }}
          DOCS_SWAGGER_URL: ${{ vars.DOCS_SWAGGER_URL || 'https://api.lrrg.dev/' }}
        run: mise run docs-build

      - name: Build — Swagger UI
        run: mise run docs-swagger

      # Publishing is skipped, never failed, when the deployment credentials are absent — a fork, a
      # pull request, or anyone else's clone must still get a green pipeline from the build alone.
      # Cloudflare Pages receives prebuilt directories: it is not asked to build anything, because it
      # cannot see this job's generated artefacts or this repository's pinned toolchain.
      # `pages deploy` cannot create a missing project non-interactively, so a project added later
      # (such as the homepage) would fail its first deploy. Same Pages-only token.
      - name: Create missing Pages projects
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          for project in lanrurugi-docs lanrurugi-api-swagger lanrurugi-sdk lanrurugi-home; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$project")
            case "$status" in
              200) ;;
              404)
                echo "creating Pages project $project"
                curl -sf -X POST "$api" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                  -H 'Content-Type: application/json' \
                  -d "{\"name\":\"$project\",\"production_branch\":\"main\"}" >/dev/null ;;
              *) echo "::error::looking up Pages project $project returned HTTP $status"; exit 1 ;;
            esac
          done

      - name: Publish docs site
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist --project-name=lanrurugi-docs

      - name: Publish Swagger UI
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist-swagger --project-name=lanrurugi-api-swagger

      - name: Publish plugin SDK reference
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/dist-sdk --project-name=lanrurugi-sdk

      # The project homepage: plain HTML/CSS/JS pre-rendered per language by a dependency-free
      # Node script (so crawlers get real text and hreflang alternates without running JS).
      - name: Build homepage
        run: node homepage/build.mjs

      - name: Publish homepage
        if: >-
          github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          needs.rust.result == 'success' && needs.frontend.result == 'success' &&
          env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy homepage/dist --project-name=lanrurugi-home
