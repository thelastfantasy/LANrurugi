name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  RUSTC_WRAPPER: sccache

jobs:
  rust:
    name: Rust (check, fmt, clippy, test)
    runs-on: ubuntu-latest
    env:
      LANRURUGI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Caches ~/.cargo and target/ across runs (constitution Technology Stack Constraints:
      # "Rust build acceleration"). `shared-key` matches the `e2e` job's own so both converge on
      # one cache entry instead of each recompiling the same dependency graph from scratch — this
      # job's `cargo test --workspace` and `e2e`'s `cargo build -p lanrurugi-server` overlap
      # heavily.
      #
      # `cache-directories` additionally persists sccache's own object cache
      # (~/.cache/sccache). Without this, sccache had a 0.00% hit rate on Rust objects on every
      # observed run (confirmed via `sccache --show-stats` on runs 29195223998/29195590947/
      # 29671404959) — each run got a brand-new runner VM with an empty sccache dir, so
      # RUSTC_WRAPPER=sccache was pure overhead (a wrapper process per rustc invocation) with zero
      # payoff. rust-cache's default directory set doesn't include it since sccache isn't
      # rust-cache's concern.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-directories: /home/runner/.cache/sccache

      - name: Zero sccache stats (isolate this run's hit rate from cache-restore noise)
        run: sccache --zero-stats

      # Same set `Dockerfile.build`'s dev image installs (see that file's own comment) —
      # `libarchive2-sys` bundles and statically links libarchive's C source, which itself links
      # against these at build time. `ubuntu-latest` doesn't ship them, so linking failed with
      # "mold: fatal: library not found: bz2" (first library alphabetically probed; the others
      # would have failed the same way one at a time without this).
      - name: Install libarchive build dependencies + redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev \
            redis-server

      # A `services.redis` Docker container can't be started with a custom `--databases` count
      # (the `services:` schema only allows docker-run flags via `options`, not overriding the
      # image's own command — and Redis's `databases` setting is immutable at runtime, confirmed
      # via `CONFIG SET databases N` returning "can't set immutable config"). The workspace's own
      # test suites collectively claim logical DB indices up to 23 across several crates
      # (`lanrurugi-scanner::pipeline`'s own comment documents its disjoint-offset convention with
      # `full_scan.rs`) — `redis-server`'s own default of 16 databases (0-15) isn't enough. Same
      # real-binary approach the `e2e` job already uses (see its own comment: a service container
      # can't be given the extra flags a real binary can).
      - name: Start redis-server with extra logical databases
        run: |
          redis-server --daemonize yes --databases 64 --save "" --appendonly no
          for i in $(seq 1 10); do
            redis-cli ping && break
            sleep 1
          done

      - name: cargo check
        run: cargo check --workspace

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: sccache stats
        if: always()
        run: scripts/sccache-summary.sh

  frontend:
    name: Frontend (eslint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: eslint
        run: pnpm run lint

      - name: build (includes tsc type-check)
        run: pnpm run build

      - name: vitest (unit)
        run: pnpm run test:unit

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      # Shares the `rust` job's own cache (default `add-job-id-key: true` would otherwise give
      # each job an entirely separate cache entry, even though this job's `cargo build -p
      # lanrurugi-server` recompiles most of the same dependency graph the `rust` job's `cargo
      # test --workspace` already built) — a real, avoidable duplicate-compile cost, not
      # inherent to needing two jobs. `cache-directories` shares the same sccache object cache too
      # (see the `rust` job's own comment on this) — this job also compiles Rust
      # (`cargo build -p lanrurugi-server`) under the same `RUSTC_WRAPPER=sccache`.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
          cache-directories: /home/runner/.cache/sccache

      - name: Zero sccache stats (isolate this run's hit rate from cache-restore noise)
        run: sccache --zero-stats

      - name: Install libarchive build dependencies + redis-server
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zlib1g-dev libbz2-dev liblzma-dev libzstd-dev liblz4-dev libxml2-dev libacl1-dev \
            redis-server

      - name: Build backend (debug)
        run: cargo build -p lanrurugi-server

      - name: sccache stats
        if: always()
        run: scripts/sccache-summary.sh

      - name: pnpm install
        working-directory: apps/frontend
        run: pnpm install --frozen-lockfile

      # Playwright's own browser downloads (~300MB combined for Chromium+Firefox) are the single
      # largest fixed cost in this job and don't change between runs unless the pinned
      # @playwright/test version does — cache them keyed on that version so most runs skip the
      # download entirely. System-level --with-deps packages are cheap apt installs, not worth
      # caching separately.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('apps/frontend/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        working-directory: apps/frontend
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium firefox
          else
            pnpm exec playwright install --with-deps chromium firefox
          fi

      - name: Build frontend
        working-directory: apps/frontend
        run: pnpm run build

      - name: playwright test
        working-directory: apps/frontend
        run: pnpm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/frontend/playwright-report/
          retention-days: 7
