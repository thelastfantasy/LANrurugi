name: 'Push Release Docker Images'

# Tagged-release counterpart of `docker.yml`. The `amend-builds` job's successful check run tells
# `/api/version` that this exact tag/commit has a pullable multi-arch image.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        arch: [amd64, arm64]
    name: push release
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "lanrurugi_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            LANRURUGI_GIT_SHA=${{ steps.sha.outputs.short_sha }}
          tags: |
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-${{ matrix.arch }}
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-${{ steps.sha.outputs.short_sha }}-${{ matrix.arch }}

  amend-builds:
    runs-on: ubuntu-24.04
    needs: push
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "lanrurugi_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: pull images
        run: |
          docker pull --platform=linux/amd64 ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-amd64
          docker pull --platform=linux/arm64 ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-arm64

      - name: create manifests
        run: |
          docker manifest create ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }} \
            --amend ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-amd64 \
            --amend ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-arm64
          docker manifest create ghcr.io/thelastfantasy/lanrurugi:latest \
            --amend ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-amd64 \
            --amend ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-arm64

      - name: push manifests
        run: |
          docker manifest push ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}
          docker manifest push ghcr.io/thelastfantasy/lanrurugi:latest
