name: 'Push Release Docker Images'

# Tagged-release counterpart of `docker.yml`. The `amend-builds` job's successful check run tells
# `/api/version` that this exact tag/commit has a pullable multi-arch image.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        arch: [amd64, arm64]
    name: push release
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "lanrurugi_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            LANRURUGI_GIT_SHA=${{ steps.sha.outputs.short_sha }}
            # The tracker groups events/sessions by `release`, which wants a version rather than a
            # commit: `lanrurugi@0.2.0`. Local builds pass no value and fall back to the SHA.
            LANRURUGI_RELEASE=lanrurugi@${{ steps.version.outputs.lanrurugi_version }}
            # Diagnostics forwarding target, baked into the image (specs/018). Empty for
            # fork PRs, so nothing is sent from a build that never sees the secret.
            LANRURUGI_TRACKER_DSN=${{ secrets.LANRURUGI_TRACKER_DSN }}
            # Stamped per registry: identical bytes cannot say where a deployment pulled them from.
            LANRURUGI_BUILD_CHANNEL=ghcr
          tags: |
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-${{ matrix.arch }}
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-${{ steps.sha.outputs.short_sha }}-${{ matrix.arch }}

      # Second build for Docker Hub, not a re-tag: `imagetools create` would copy GHCR's manifest
      # and Docker Hub pulls would then report `ghcr`. All Rust layers are cache hits.
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_IMAGE != '' && env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        if: env.DOCKERHUB_IMAGE != '' && env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            LANRURUGI_GIT_SHA=${{ steps.sha.outputs.short_sha }}
            LANRURUGI_RELEASE=lanrurugi@${{ steps.version.outputs.lanrurugi_version }}
            LANRURUGI_TRACKER_DSN=${{ secrets.LANRURUGI_TRACKER_DSN }}
            LANRURUGI_BUILD_CHANNEL=dockerhub
          tags: |
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.lanrurugi_version }}-${{ matrix.arch }}
            docker.io/${{ env.DOCKERHUB_IMAGE }}:${{ steps.version.outputs.lanrurugi_version }}-${{ steps.sha.outputs.short_sha }}-${{ matrix.arch }}

  amend-builds:
    runs-on: ubuntu-24.04
    needs: push
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "lanrurugi_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: set the repository variable DOCKERHUB_IMAGE (e.g. user/lanrurugi)
      # and the secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to publish there as well.
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_IMAGE != '' && env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One multi-arch manifest per tag, per registry — each assembled from its own per-arch tags,
      # since the two registries now hold different images (see the second build in `push`).
      - name: publish multi-arch manifests
        run: |
          tags=""
          # The per-sha tag is pushed as `-amd64`/`-arm64` too, so it needs a manifest of its own —
          # without this it stayed single-arch and `docker pull` failed on the other architecture.
          for tag in "${{ steps.version.outputs.lanrurugi_version }}" \
                     "${{ steps.version.outputs.lanrurugi_version }}-${{ steps.sha.outputs.short_sha }}" \
                     latest; do
            tags="$tags -t ghcr.io/thelastfantasy/lanrurugi:$tag"
          done
          docker buildx imagetools create $tags \
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-amd64 \
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-arm64

          if [ -n "$DOCKERHUB_IMAGE" ] && [ "$HAS_DOCKERHUB_TOKEN" = true ]; then
            hub_tags=""
            for tag in "${{ steps.version.outputs.lanrurugi_version }}" \
                       "${{ steps.version.outputs.lanrurugi_version }}-${{ steps.sha.outputs.short_sha }}" \
                       latest; do
              hub_tags="$hub_tags -t docker.io/$DOCKERHUB_IMAGE:$tag"
            done
            docker buildx imagetools create $hub_tags \
              docker.io/$DOCKERHUB_IMAGE:${{ steps.version.outputs.lanrurugi_version }}-amd64 \
              docker.io/$DOCKERHUB_IMAGE:${{ steps.version.outputs.lanrurugi_version }}-arm64
          fi
