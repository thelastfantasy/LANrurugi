name: 'Push Release Docker Images'

# Tagged-release counterpart of `docker.yml`. The `amend-builds` job's successful check run tells
# `/api/version` that this exact tag/commit has a pullable multi-arch image.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  push:
    strategy:
      matrix:
        arch: [amd64, arm64]
    name: push release
    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "lanrurugi_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          push: true
          platforms: linux/${{ matrix.arch }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          build-args: |
            LANRURUGI_GIT_SHA=${{ steps.sha.outputs.short_sha }}
            # Diagnostics forwarding target, baked into the image (specs/018). Empty for
            # fork PRs, so nothing is sent from a build that never sees the secret.
            LANRURUGI_TRACKER_DSN=${{ secrets.LANRURUGI_TRACKER_DSN }}
          tags: |
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-${{ matrix.arch }}
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-${{ steps.sha.outputs.short_sha }}-${{ matrix.arch }}

  amend-builds:
    runs-on: ubuntu-24.04
    needs: push
    env:
      DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
      HAS_DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          echo "lanrurugi_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"

      - name: Get commit sha
        id: sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub is optional: set the repository variable DOCKERHUB_IMAGE (e.g. user/lanrurugi)
      # and the secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN to publish there as well.
      - uses: docker/login-action@v3
        if: env.DOCKERHUB_IMAGE != '' && env.HAS_DOCKERHUB_TOKEN == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One multi-arch manifest per tag, copied to every configured registry.
      - name: publish multi-arch manifests
        run: |
          tags=""
          for tag in "${{ steps.version.outputs.lanrurugi_version }}" latest; do
            tags="$tags -t ghcr.io/thelastfantasy/lanrurugi:$tag"
            if [ -n "$DOCKERHUB_IMAGE" ] && [ "$HAS_DOCKERHUB_TOKEN" = true ]; then
              tags="$tags -t docker.io/$DOCKERHUB_IMAGE:$tag"
            fi
          done
          docker buildx imagetools create $tags \
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-amd64 \
            ghcr.io/thelastfantasy/lanrurugi:${{ steps.version.outputs.lanrurugi_version }}-arm64
