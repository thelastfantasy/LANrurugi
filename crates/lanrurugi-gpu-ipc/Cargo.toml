[package]
name = "lanrurugi-gpu-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
tarpc.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "rt", "time"] }

[dev-dependencies]
# Pinned to the exact version `tarpc`'s own `serde-transport-bincode` feature resolves to (see the
# workspace `Cargo.lock`), *not* to the latest stable release: the test that uses this exists purely
# to reproduce the transport's own framing of an `erase_page` request, so a different major version
# would measure a different wire format and verify nothing.
bincode = "1.3.3"
