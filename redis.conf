# Redis persistence config, bundled into the same image/container as `lanrurugi-server` (see
# Dockerfile's runtime stage) — matches legacy LANraragi's own real single-container deployment
# (one container, Redis included, not a separate service; verified against
# tools/Documentation/installing-lanraragi/docker.md).
#
# Mirrors the real, meaningful (non-default) directives from legacy's own
# tools/build/docker/redis.conf — specifically `dbfilename database.rdb`, `appendonly yes`, and
# `dir` (Redis's own out-of-box defaults are `dump.rdb`, `appendonly no`, and `dir .`; everything
# legacy's file left at Redis's own default, like `save 900 1`/`rdbcompression yes`, is omitted
# here rather than copied verbatim, since restating a default changes nothing).
#
# `dir` mirrors legacy's own `/home/koyomi/lanraragi/database` with the project name swapped —
# `/home/koyomi/lanrurugi/database` — not `/data`, so the bind-mounted host directory and the
# in-container path both follow the same single-container-app convention legacy itself uses,
# rather than the official upstream `redis` image's own separate-service `/data` default.

port 16379
dbfilename database.rdb
dir /home/koyomi/lanrurugi/database
appendonly yes
appendfilename "appendonly.aof"
