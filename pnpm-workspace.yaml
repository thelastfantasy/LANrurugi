packages:
  # The frontend and the documentation site (`apps/docs-site`, 011-api-docs-site, moved out of
  # `docs/` by #305 so `docs/` holds only project documentation).
  - "apps/*"
allowBuilds:
  '@fortawesome/fontawesome-free': true
  # Telemetry-only postinstall, pulled in by `swagger-ui-dist`. Denied deliberately.
  '@scarf/scarf': false
  sharp: true
  # Pulled in by `@scalar/api-reference`'s Vue dependency tree. Its only build script picks the
  # Vue 2 or Vue 3 shim by detecting which one is installed; this workspace is Vue 3 only, so
  # allowing it is both safe and what makes the package resolve correctly.
  vue-demi: true
  # `wrangler` (the Cloudflare Pages deploy step) pulls these two; both have a postinstall that
  # fetches their platform binary, and pnpm 12 treats an unapproved build script as an error
  # (ERR_PNPM_IGNORED_BUILDS). This repo's switch is `allowBuilds`, not `onlyBuiltDependencies`.
  esbuild: true
  workerd: true

# `eslint` 10 and `@typescript-eslint` still pin `minimatch@^10`, and the whole `<11.0.1` range
# carries an unfixed ReDoS advisory (Dependabot, 2026-11-04). No upstream release moves it yet, so
# it is forced here; 11.0.1 still ships the CommonJS entry point the lint tooling loads.
overrides:
  minimatch@<11.0.1: 11.0.1
