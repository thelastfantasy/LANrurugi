<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- e-hentai's own classic skin palette (verified against this repo's own
         apps/frontend/public/legacy/themes/g.css, a direct port of that site's default
         colors): wine-red #5C0D11 through amber-brown #9B4E03. -->
    <linearGradient id="bg" x1="10" y1="10" x2="502" y2="502" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5C0D11"/>
      <stop offset="1" stop-color="#9B4E03"/>
    </linearGradient>
    <!-- soft bloom behind the star so a static shape still reads as "glinting". -->
    <filter id="starGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="492" height="492" rx="123" fill="url(#bg)"/>
  <path d="M256 184.32C179.2 158.72 102.4 158.72 102.4 215.04V302.08C102.4 332.8 179.2 358.4 256 332.8Z" fill="#F2EFDF"/>
  <path d="M256 184.32C332.8 158.72 409.6 158.72 409.6 215.04V302.08C409.6 332.8 332.8 358.4 256 332.8Z" fill="#F2EFDF"/>
  <line x1="256" y1="184.32" x2="256" y2="332.8" stroke="#5C0D11" stroke-opacity="0.35" stroke-width="9.216"/>
  <!-- Lucide "Sparkle" icon (ISC license, already a project dependency via react-icons'
       Lu set as LuSparkle), scaled up; kept white to match the book pages rather than
       introducing a separate accent color. A blurred glow-copy sits behind the crisp
       copy to fake a "glinting" highlight on an otherwise fully static icon. -->
  <path transform="translate(368,58) scale(3.5)"
        d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"
        fill="#F2EFDF" opacity="0.9" filter="url(#starGlow)"/>
  <path transform="translate(368,58) scale(3.5)"
        d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"
        fill="#F2EFDF"/>
</svg>
