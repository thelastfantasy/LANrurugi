# Local dev/try runtime for the `lanrurugi-try` image — a single container bundling
# `lanrurugi-server` + Redis together (see Dockerfile's runtime stage and
# scripts/docker-entrypoint.sh), matching legacy LANraragi's own real single-container deployment
# convention (verified against tools/Documentation/installing-lanraragi/docker.md: one
# `difegue/lanraragi` container with three bind mounts under
# `/home/koyomi/lanraragi/{content,thumb,database}` — no separate Redis container/service in
# their own documented examples). Not used by CI (see .github/workflows/ci.yml,
# Dockerfile.act-runner) or the cargo-in-container tasks in .mise.toml (those build/test the
# workspace itself; this runs the built server). Bring up with `podman compose up -d` (or
# `docker compose up -d`), rebuild the image after a source change with `podman compose build`.
#
# `network_mode: host` because `lanrurugi-server` was developed and verified against
# 127.0.0.1:3000 directly on the host network — switching to bridge networking would need every
# already-verified same-origin frontend assumption re-checked, for no real benefit on a
# single-host dev setup.
services:
  lanrurugi:
    image: localhost/lanrurugi-try:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lrr-try
    network_mode: host
    volumes:
      # Host-side dirs keep their existing, project-native names (data/manga, data/thumb,
      # data/database) — only the *container-side* paths mirror legacy's
      # `/home/koyomi/lanraragi/...` convention (project name swapped, per redis.conf/Dockerfile's
      # own doc comments).
      - ./data/manga:/home/koyomi/lanrurugi/content
      - ./data/thumb:/home/koyomi/lanrurugi/thumb
      - ./data/database:/home/koyomi/lanrurugi/database
      # ONNX embedding model + tokenizer for the reader recommender (lanrurugi-recommend,
      # auto-downloaded on startup — see crates/lanrurugi-recommend/src/model_download.rs).
      - ./data/models:/home/koyomi/lanrurugi/models
      - lrr-try-log:/log
      - lrr-try-temp:/temp
      # MaxMind GeoLite2-City database — `docker-entrypoint.sh` runs `geoipupdate` into this path
      # on every container start (best-effort, skipped if LANRURUGI_GEOIP_ACCOUNT_ID/
      # LANRURUGI_GEOIP_LICENSE_KEY below aren't set). Persisting it means a restart doesn't force
      # a redundant re-download of the same day's database.
      - lrr-try-geoip:/var/lib/GeoIP
    environment:
      # Optional — a free MaxMind account's own credentials
      # (https://www.maxmind.com/en/geolite2/signup), used only by `docker-entrypoint.sh`'s
      # `geoipupdate` call to fetch/refresh the GeoLite2-City database `lanrurugi_api::geoip` reads
      # for activity-log geo data. Unset = no geo data recorded, everything else works unaffected.
      - LANRURUGI_GEOIP_ACCOUNT_ID=${LANRURUGI_GEOIP_ACCOUNT_ID:-}
      - LANRURUGI_GEOIP_LICENSE_KEY=${LANRURUGI_GEOIP_LICENSE_KEY:-}
    restart: unless-stopped

volumes:
  lrr-try-log:
  lrr-try-temp:
  lrr-try-geoip:
